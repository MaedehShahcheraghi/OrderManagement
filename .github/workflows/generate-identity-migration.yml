name: Identity migration generation

on:
  pull_request:
    branches: [develop]

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__SqlServer: 'Server=localhost;Database=OrderManagementDB;User Id=sa;Password=TestOnlyPassword_123!;TrustServerCertificate=True'
      Jwt__SigningKey: 'migration-design-time-test-key-32bytes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OrderManagement.slnx
      - run: dotnet tool restore
      - name: Generate Identity migration
        run: |
          dotnet ef migrations add InitialIdentitySchema --project "src/ OrderManagement.Infrastructure.Identity" --startup-project src/OrderManagement.Api --context IdentityDBContext --output-dir Migrations
      - name: Print migration source
        run: |
          for file in "src/ OrderManagement.Infrastructure.Identity/Migrations/"*.cs; do
            echo "__FILE_START__${file}"
            cat "$file"
            echo "__FILE_END__"
          done
